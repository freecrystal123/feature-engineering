bundle:
  name: feature-engineering

variables:
  environment:
    description: Environment name
    default: train
  analysis_cluster_id:
    description: Existing cluster id for Machine Learning Cluster
    default: 0417-232722-qblfgc6k
  training_schedule_pause_status:
    description: Pause status for training cadence jobs
    default: PAUSED
  prediction_schedule_pause_status:
    description: Pause status for prediction cadence jobs
    default: PAUSED
  job_run_as_service_principal_id:
    description: Service principal application ID used to run all jobs
    default: cedc8a11-f021-4e7f-a141-5137369b51b7

include:
  - dabs/targets/*.yml
  - dabs/resources/*.yml

