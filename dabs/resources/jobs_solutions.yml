resources:
  jobs:
    user_segmentation_training:
      name: user_segmentation_training
      tags:
        solution: user_segmentation
        cadence: each_3m
      schedule:
        quartz_cron_expression: "0 0 2 1 1/3 ?"
        timezone_id: Asia/Dubai
        pause_status: ${var.training_schedule_pause_status}
      tasks:
        - task_key: feature_engineering
          notebook_task:
            notebook_path: ${workspace.file_path}/models/user_segmentation/01_feature_engineering_online_live_casino_ap2
            source: WORKSPACE
          existing_cluster_id: ${var.analysis_cluster_id}
        - task_key: model_training
          depends_on:
            - task_key: feature_engineering
          notebook_task:
            notebook_path: ${workspace.file_path}/models/user_segmentation/02_model_training
            source: WORKSPACE
            base_parameters:
              analysis_id: all
              candidate_alias: challenger
          existing_cluster_id: ${var.analysis_cluster_id}
        - task_key: prediction
          depends_on:
            - task_key: model_training
          notebook_task:
            notebook_path: ${workspace.file_path}/models/user_segmentation/03_model_prediction
            source: WORKSPACE
            base_parameters:
              analysis_id: all
              model_alias: challenger
          existing_cluster_id: ${var.analysis_cluster_id}
        - task_key: cluster_naming
          depends_on:
            - task_key: prediction
          notebook_task:
            notebook_path: ${workspace.file_path}/models/user_segmentation/031_clusters_name
            source: WORKSPACE
          existing_cluster_id: ${var.analysis_cluster_id}
        - task_key: reports
          depends_on:
            - task_key: cluster_naming
          notebook_task:
            notebook_path: ${workspace.file_path}/models/user_segmentation/032_clusters_reports
            source: WORKSPACE
          existing_cluster_id: ${var.analysis_cluster_id}
      queue:
        enabled: true

    user_segmentation_prediction:
      name: user_segmentation_prediction
      tags:
        solution: user_segmentation
        cadence: each_1d
      job_clusters:
        - job_cluster_key: user_segmentation_prediction_cluster
          new_cluster:
            spark_version: 18.0.x-scala2.13
            driver_node_type_id: Standard_D16ads_v5
            node_type_id: Standard_D16ads_v5
            autoscale:
              min_workers: 1
              max_workers: 9
            autotermination_minutes: 60
            data_security_mode: USER_ISOLATION
            runtime_engine: STANDARD
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"
        timezone_id: Asia/Dubai
        pause_status: ${var.prediction_schedule_pause_status}
      tasks:
        - task_key: feature_engineering
          notebook_task:
            notebook_path: ${workspace.file_path}/models/user_segmentation/01_feature_engineering_online_live_casino_ap2
            source: WORKSPACE
            base_parameters:
              analysis_id: analysis_6
          job_cluster_key: user_segmentation_prediction_cluster
        - task_key: prediction
          depends_on:
            - task_key: feature_engineering
          notebook_task:
            notebook_path: ${workspace.file_path}/models/user_segmentation/03_model_prediction
            source: WORKSPACE
            base_parameters:
              analysis_id: analysis_6
              model_alias: champion
          libraries:
            - pypi:
                package: scikit-learn==1.6.1
          job_cluster_key: user_segmentation_prediction_cluster
        - task_key: reports
          depends_on:
            - task_key: prediction
          notebook_task:
            notebook_path: ${workspace.file_path}/models/user_segmentation/032_clusters_reports
            source: WORKSPACE
            base_parameters:
              analysis_id: analysis_6
          job_cluster_key: user_segmentation_prediction_cluster
      queue:
        enabled: true

    cross_sell_mba_prediction:
      name: cross_sell_mba_prediction
      tags:
        solution: cross_sell_mba
        cadence: each_1d
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: Asia/Dubai
        pause_status: ${var.prediction_schedule_pause_status}
      tasks:
        - task_key: mba_feature_engineering
          notebook_task:
            notebook_path: ${workspace.file_path}/models/cross_sell_mba/01_mba_features
            source: WORKSPACE
          existing_cluster_id: ${var.analysis_cluster_id}
        - task_key: mba_model_training
          depends_on:
            - task_key: mba_feature_engineering
          notebook_task:
            notebook_path: ${workspace.file_path}/models/cross_sell_mba/02_mba_model_training
            source: WORKSPACE
          existing_cluster_id: ${var.analysis_cluster_id}
        - task_key: mba_reports
          depends_on:
            - task_key: mba_model_training
          notebook_task:
            notebook_path: ${workspace.file_path}/models/cross_sell_mba/03_mba_reports
            source: WORKSPACE
          existing_cluster_id: ${var.analysis_cluster_id}
      queue:
        enabled: true
